    );

    // --- INITIAL MOCK DATA ---
    const initialFarm = {
      farmerName: 'Ramesh Patel',
      farmName: 'Green Valley Farm',
      location: 'Nashik, Maharashtra',
      crop: 'Tomato',
      area: '4.5 Acres',
      growthStage: 'Flowering',
      zonesCount: 3,
      overallHealth: 'Good'
    };

    const initialZonesList = [
      { id: 'zone-1', name: 'Zone 1 (North Field)', crop: 'Tomato', soilMoisture: 42, temperature: 30, humidity: 68, status: 'Good', riskLevel: 'Low', lastUpdated: 'Just now', irrigationStatus: 'Idle' },
      { id: 'zone-2', name: 'Zone 2 (East Slope)', crop: 'Tomato', soilMoisture: 21, temperature: 34, humidity: 55, status: 'Attention Required', riskLevel: 'High', lastUpdated: '1 min ago', irrigationStatus: 'Recommended' },
      { id: 'zone-3', name: 'Zone 3 (South Terrace)', crop: 'Tomato', soilMoisture: 39, temperature: 31, humidity: 65, status: 'Good', riskLevel: 'Low', lastUpdated: '2 mins ago', irrigationStatus: 'Idle' }
    ];

    const initialAlertsList = [
      { id: 'alert-1', severity: 'WARNING', title: 'Zone 2 soil moisture is critically low (21%)', zone: 'Zone 2 (East Slope)', explanation: 'Soil moisture has dropped below the 25% threshold for Tomato flowering stage. Crop may experience transpiration stress.', suggestedAction: 'Inspect Zone 2 drip lateral valve and consider activating supplementary irrigation.', timestamp: '15 mins ago', isRead: false },
      { id: 'alert-2', severity: 'INFO', title: 'Precipitation expected within 24–36 hours', zone: 'Farm-wide', explanation: 'Regional weather forecast models indicate a 70% chance of showers tomorrow afternoon (approx 20mm rainfall).', suggestedAction: 'Avoid applying water-soluble fertilizers or overhead irrigation today.', timestamp: '1 hour ago', isRead: false },
      { id: 'alert-3', severity: 'WARNING', title: 'High temperature risk (34°C) in afternoon hours', zone: 'Zone 2 (East Slope)', explanation: 'Afternoon canopy temperature exceeded 33°C. Tomato flowers are vulnerable to pollen abortion under heat.', suggestedAction: 'Monitor flower retention and evaluate micro-sprinkler misting.', timestamp: '2 hours ago', isRead: true },
      { id: 'alert-4', severity: 'INFO', title: 'Crop health leaf check recommended', zone: 'Zone 1 (North Field)', explanation: 'Mild humidity accumulation recorded overnight. Ideal conditions for early screening of fungal leaf spot symptoms.', suggestedAction: 'Capture a leaf photo using Crop Health camera tool for automated AI screening.', timestamp: 'Yesterday', isRead: true }
    ];

    const mockWeather = {
      currentTemp: 32,
      humidity: 64,
      rainProbability: 20,
      windSpeed: 14,
      condition: 'Partly Cloudy',
      uvIndex: 7,
      summary: 'Warm and partly cloudy afternoon. Light breeze favorable for field work.'
    };

    const mockForecasts = [
      { day: 'Today', date: 'Sep 04', maxTemp: 32, minTemp: 23, rainProbability: 20, condition: 'Partly Cloudy', humidity: 64, wind: 14 },
      { day: 'Tomorrow', date: 'Sep 05', maxTemp: 30, minTemp: 22, rainProbability: 70, condition: 'Rainy', humidity: 82, wind: 19 },
      { day: 'Saturday', date: 'Sep 06', maxTemp: 28, minTemp: 21, rainProbability: 60, condition: 'Thunderstorm', humidity: 86, wind: 24 },
      { day: 'Sunday', date: 'Sep 07', maxTemp: 31, minTemp: 22, rainProbability: 30, condition: 'Cloudy', humidity: 71, wind: 12 },
      { day: 'Monday', date: 'Sep 08', maxTemp: 33, minTemp: 24, rainProbability: 10, condition: 'Sunny', humidity: 58, wind: 11 }
    ];

    const sampleImages = [
      { id: 'sample-disease', label: 'Leaf Spot / Blight', type: 'disease', url: 'https://images.unsplash.com/photo-1592417817098-8f3d6910a451?auto=format&fit=crop&w=600&q=80', hint: 'disease' },
      { id: 'sample-healthy', label: 'Healthy Tomato Leaf', type: 'healthy', url: 'https://images.unsplash.com/photo-1591857177580-dc82b9ac4e1e?auto=format&fit=crop&w=600&q=80', hint: 'healthy' },
      { id: 'sample-pest', label: 'Pest Foliage Damage', type: 'pest', url: 'https://images.unsplash.com/photo-1530595467537-0b5996c41f2d?auto=format&fit=crop&w=600&q=80', hint: 'pest' },
      { id: 'sample-nutrient', label: 'Nutrient Chlorosis', type: 'nutrient', url: 'https://images.unsplash.com/photo-1615811361523-6bd03d7748e7?auto=format&fit=crop&w=600&q=80', hint: 'nutrient' }
    ];

    // --- MAIN REACT APPLICATION COMPONENT ---
    function App() {
      const [activePage, setActivePage] = useState('landing');
      const [farm, setFarm] = useState(initialFarm);
      const [zones, setZones] = useState(initialZonesList);
      const [alerts, setAlerts] = useState(initialAlertsList);
      const [isDemoMode, setIsDemoMode] = useState(true);
      const [selectedImage, setSelectedImage] = useState(sampleImages[0].url);
      const [sampleHint, setSampleHint] = useState('disease');
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analysisResult, setAnalysisResult] = useState(null);
      const [chartTimeframe, setChartTimeframe] = useState('24h');
      const [isSimulating, setIsSimulating] = useState(false);
      const [telemetryLogs, setTelemetryLogs] = useState([
        { time: '11:20 AM', node: 'esp32-node-1', zone: 'zone-1', moisture: 42, temp: 30, hum: 68 },
        { time: '11:22 AM', node: 'esp32-node-2', zone: 'zone-2', moisture: 21, temp: 34, hum: 55 }
      ]);

      // Dynamic rule-based AI recommendations based on state
      const recommendations = useMemo(() => {
        const recs = [];
        zones.forEach(zone => {
          if (zone.soilMoisture < 25 && zone.temperature > 32) {
            recs.push({
              id: `rec-water-${zone.id}`,
              priority: 'HIGH',
              category: 'WATER_STRESS',
              title: `${zone.name} – Possible Water Stress`,
              zone: zone.name,
              reason: `Soil moisture is low (${zone.soilMoisture}%) and temperature is elevated (${zone.temperature}°C).`,
              recommendation: `Check irrigation requirement for ${zone.name}. Avoid unnecessary irrigation if significant rainfall is expected.`
            });
          }
        });

        if (mockWeather.rainProbability >= 60) {
          recs.push({
            id: 'rec-rain',
            priority: 'MEDIUM',
            category: 'OVER_IRRIGATION',
            title: 'Weather Risk – Heavy Rainfall Possibility',
            reason: `High probability of upcoming rain (${mockWeather.rainProbability}%) detected.`,
            recommendation: 'Monitor drainage and avoid unnecessary irrigation before expected rainfall.'
          });
        }

        recs.push({
          id: 'rec-health',
          priority: 'LOW',
          category: 'CROP_HEALTH',
          title: 'Crop Health Advisory – Leaf Condition Screening',
          reason: 'Foliage in flowering stage requires frequent inspection for pest & moisture balance.',
          recommendation: 'Inspect affected plants closely and consider confirming the cause with a local agricultural expert before treatment.'
        });

        return recs;
      }, [zones]);

      // Simulate incoming ESP32 sensor telemetry
      const handleSimulateSensor = () => {
        setIsSimulating(true);
        const updated = zones.map((z, idx) => {
          if (idx === 1) {
            // vary zone 2
            const deltaM = Math.round((Math.random() * 4 - 2));
            const deltaT = Math.round((Math.random() * 1.4 - 0.7) * 10) / 10;
            const newM = Math.max(15, Math.min(60, z.soilMoisture + deltaM));
            const newT = Math.round((z.temperature + deltaT) * 10) / 10;
            return {
              ...z,
              soilMoisture: newM,
              temperature: newT,
              status: newM < 25 ? 'Attention Required' : 'Good',
              lastUpdated: 'Just now'
            };
          }
          return z;
        });
        setZones(updated);

        const newLog = {
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
          node: 'esp32-node-2',
          zone: 'zone-2',
          moisture: updated[1].soilMoisture,
          temp: updated[1].temperature,
          hum: updated[1].humidity
        };
        setTelemetryLogs(prev => [newLog, ...prev.slice(0, 8)]);

        setTimeout(() => setIsSimulating(false), 500);
      };

      // Simulate a new alert trigger
      const handleSimulateAlert = () => {
        const newAl = {
          id: `al-${Date.now()}`,
          severity: 'WARNING',
          title: `Simulated Alert: Moisture drop in Zone 2 (${Math.floor(Math.random()*5 + 18)}%)`,
          zone: 'Zone 2 (East Slope)',
          explanation: 'Edge sensor telemetry threshold triggered by sudden soil drying.',
          suggestedAction: 'Check drip valve lines or verify probe contact.',
          timestamp: 'Just now',
          isRead: false
        };
        setAlerts(prev => [newAl, ...prev]);
      };

      // Simulate AI Image Analysis
      const handleAnalyzeImage = () => {
        setIsAnalyzing(true);
        setTimeout(() => {
          let category = 'Disease symptoms';
          let status = 'Possible Crop Stress Detected';
          let conf = 82;
          let rec = 'Inspect nearby plants and verify symptoms before taking treatment action. Consider consulting an agricultural extension officer.';

          if (sampleHint === 'healthy') {
            category = 'Healthy';
            status = 'Foliage Appears Healthy';
            conf = 94;
            rec = 'Maintain regular moisture monitoring and good sanitation practices.';
          } else if (sampleHint === 'pest') {
            category = 'Pest damage';
            status = 'Possible Pest Foliage Damage';
            conf = 87;
            rec = 'Inspect underside of leaves for larvae or eggs. Deploy sticky pheromone traps.';
          } else if (sampleHint === 'nutrient') {
            category = 'Nutrient stress';
            status = 'Possible Nutrient Chlorosis';
            conf = 79;
            rec = 'Check soil pH and evaluate micronutrient foliar spray with a local agronomist.';
          }

          setAnalysisResult({
            category,
            status,
            confidence: conf,
            recommendation: rec,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          });
          setIsAnalyzing(false);
        }, 1200);
      };

      const unreadAlerts = alerts.filter(a => !a.isRead).length;

      // Navigation Items list
      const navItems = [
        { id: 'dashboard', label: 'Dashboard', icon: IconDashboard },
        { id: 'weather', label: 'Weather', icon: IconWeather },
        { id: 'ai-recommendations', label: 'AI Assistant', icon: IconBot },
        { id: 'crop-health', label: 'Crop Health', icon: IconScan },
        { id: 'zones', label: 'Farm Zones', icon: IconZones },
        { id: 'sensors', label: 'Sensors (IoT)', icon: IconCpu },
        { id: 'alerts', label: 'Alerts', icon: IconBell, badge: unreadAlerts },
        { id: 'history', label: 'Farm History', icon: IconHistory },
        { id: 'settings', label: 'Settings', icon: IconSettings }
      ];

      if (activePage === 'landing') {
        return (
          <div className="min-h-screen bg-slate-50 flex flex-col">
            <header className="bg-white/90 backdrop-blur border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="w-10 h-10 rounded-xl bg-emerald-600 text-white flex items-center justify-center shadow-sm">
                  <IconSprout className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-extrabold text-lg text-slate-900 tracking-tight">
                    AgriSense <span className="text-emerald-600">AI</span>
                  </h1>
                  <span className="text-[11px] text-slate-500 font-medium">Smart Farming Assistant</span>
                </div>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => setActivePage('auth')} className="text-sm font-semibold text-slate-700 hover:text-emerald-700 px-3 py-2">
                  Sign In
                </button>
                <button onClick={() => setActivePage('dashboard')} className="px-4 py-2 bg-emerald-50 text-emerald-700 border border-emerald-200 font-semibold text-sm rounded-xl hover:bg-emerald-100 flex items-center gap-1.5 shadow-xs">
                  <IconSparkles className="w-4 h-4 text-emerald-600" />
                  <span>View Demo</span>
                </button>
                <button onClick={() => setActivePage('setup')} className="px-4 py-2 bg-emerald-600 text-white font-semibold text-sm rounded-xl hover:bg-emerald-700 shadow-sm flex items-center gap-1">
                  <span>Get Started</span>
                  <IconArrowRight className="w-4 h-4" />
                </button>
              </div>
            </header>

            {/* Hero */}
            <section className="pt-16 pb-24 text-center px-4 bg-gradient-to-b from-emerald-50/60 via-white to-slate-50">
              <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-emerald-100/80 border border-emerald-300 text-emerald-800 text-xs font-semibold mb-6">
                <IconSparkles className="w-4 h-4 text-emerald-600" />
                <span>Smart India Hackathon Prototype • Precision Agro-Tech</span>
              </div>
              <h1 className="text-4xl sm:text-6xl font-extrabold text-slate-900 tracking-tight max-w-4xl mx-auto">
                AgriSense <span className="text-emerald-600">AI</span>
                <span className="block text-2xl sm:text-4xl font-bold text-slate-700 mt-3">Smart Farming Assistant</span>
              </h1>
              <p className="mt-5 text-xl font-medium text-emerald-800 italic max-w-2xl mx-auto">
                "Sense your farm. Understand its condition. Make better decisions."

                            <span className="px-2 py-0.5 bg-rose-100 text-rose-800 rounded-full text-[10px]">{rec.priority}</span>
                          </div>
                          <p className="text-slate-600"><strong>Reason:</strong> {rec.reason}</p>
                          <p className="text-emerald-800 font-medium bg-emerald-50 p-2 rounded-lg border border-emerald-200">
                            <strong>Recommendation:</strong> {rec.recommendation}
                          </p>
                        </div>
                      ))}
                    </div>

                    <div className="p-5 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-3">
                      <div className="flex justify-between items-center">
                        <h3 className="font-bold text-slate-900 text-base flex items-center gap-2">
                          <IconAlert className="w-5 h-5 text-amber-600" />
                          <span>Recent Farm Alerts</span>
                        </h3>
                        <button onClick={()=>setActivePage('alerts')} className="text-xs text-emerald-700 font-semibold">View All →</button>
                      </div>
                      {alerts.slice(0, 2).map((al) => (
                        <div key={al.id} className="p-3.5 rounded-2xl bg-slate-50 border border-slate-200 text-xs space-y-1">
                          <div className="flex justify-between font-bold text-slate-900">
                            <span>{al.title}</span>
                            <span className="text-[10px] text-slate-400">{al.timestamp}</span>
                          </div>
                          <p className="text-slate-600">{al.explanation}</p>
                          <span className="text-emerald-700 block font-semibold">Action: {al.suggestedAction}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* === VIEW 2: WEATHER === */}
              {activePage === 'weather' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconWeather className="w-7 h-7 text-sky-600" />
                      Weather & Agro-Meteorology
                    </h2>
                    <span className="px-3 py-1 bg-amber-50 text-amber-800 border border-amber-200 text-xs rounded-xl font-medium">
                      Weather data shown in prototype mode.
                    </span>
                  </div>

                  <div className="p-6 rounded-3xl bg-gradient-to-r from-sky-600 to-indigo-800 text-white shadow-md flex flex-col md:flex-row justify-between items-center gap-6">
                    <div>
                      <span className="text-sky-200 text-xs font-bold uppercase tracking-wider">Current Conditions • {farm.location}</span>
                      <div className="text-5xl font-extrabold mt-1">{mockWeather.currentTemp}°C</div>
                      <div className="text-lg font-semibold text-sky-100">{mockWeather.condition}</div>
                      <p className="text-xs text-sky-200 mt-2 max-w-md">{mockWeather.summary}</p>
                    </div>
                    <div className="grid grid-cols-2 gap-3 text-xs">
                      <div className="p-3 bg-white/10 backdrop-blur rounded-xl">Rain Probability: <strong className="block text-base">{mockWeather.rainProbability}%</strong></div>
                      <div className="p-3 bg-white/10 backdrop-blur rounded-xl">Relative Humidity: <strong className="block text-base">{mockWeather.humidity}%</strong></div>
                      <div className="p-3 bg-white/10 backdrop-blur rounded-xl">Wind Speed: <strong className="block text-base">{mockWeather.windSpeed} km/h</strong></div>
                      <div className="p-3 bg-white/10 backdrop-blur rounded-xl">UV Index: <strong className="block text-base">{mockWeather.uvIndex} (High)</strong></div>
                    </div>
                  </div>

                  {/* Weather Risk */}
                  <div className="p-5 rounded-2xl bg-amber-50 border border-amber-200 space-y-2">
                    <span className="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-amber-200 text-amber-900 uppercase">
                      Weather Risk: Moderate Rain Risk
                    </span>
                    <h3 className="font-bold text-slate-900 text-base">Rain is expected tomorrow (70% probability).</h3>
                    <p className="text-xs text-slate-600">Check irrigation requirements before watering. Delaying irrigation for 24 hours avoids water logging and preserves soil nutrients.</p>
                  </div>

                  {/* 5-day cards */}
                  <div>
                    <h3 className="font-bold text-slate-900 text-base mb-3">5-Day Upcoming Forecast</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-5 gap-3">
                      {mockForecasts.map((f) => (
                        <div key={f.day} className="p-4 bg-white rounded-2xl border border-slate-200 text-center space-y-2 shadow-xs">
                          <span className="font-bold text-sm text-slate-900 block">{f.day}</span>
                          <span className="text-[11px] text-slate-400">{f.date}</span>
                          <div className="text-xl font-extrabold text-slate-900 my-1">{f.maxTemp}°C</div>
                          <span className="text-xs font-semibold text-slate-600 block">{f.condition}</span>
                          <span className="text-xs text-blue-600 font-bold block">Rain: {f.rainProbability}%</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* === VIEW 3: AI RECOMMENDATIONS === */}
              {activePage === 'ai-recommendations' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconBot className="w-8 h-8 text-emerald-600" />
                      AI Farm Assistant
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">Rule-based decision support analyzing sensors, weather, and crop stages.</p>
                  </div>

                  <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                    <strong>Ethical Advisory Notice:</strong> Outputs represent prototype decision-support rules. Always verify in the field and consult with an agricultural extension officer or local expert before treatment.
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {recommendations.map((rec) => (
                      <div key={rec.id} className="p-5 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-3">
                        <div className="flex justify-between items-start">
                          <span className="text-xs font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-800">
                            {rec.priority} PRIORITY
                          </span>
                          <span className="text-xs text-slate-400 font-medium">{rec.zone || 'Farm-wide'}</span>
                        </div>
                        <h3 className="text-base font-bold text-slate-900">{rec.title}</h3>
                        <div className="p-3 bg-slate-50 rounded-xl text-xs text-slate-600">
                          <strong>Reason:</strong> {rec.reason}
                        </div>
                        <div className="p-3.5 bg-emerald-50 rounded-xl border border-emerald-200 text-xs text-emerald-950 font-medium">
                          <strong>Recommendation:</strong> {rec.recommendation}
                        </div>
                        <span className="text-[11px] text-slate-400 block pt-1">Decision Support Rule • Requires Verification</span>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* === VIEW 4: CROP HEALTH === */}
              {activePage === 'crop-health' && (
                <div className="space-y-6">
                  <div>
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconScan className="w-8 h-8 text-emerald-600" />
                      Crop Health & Image Analysis
                    </h2>
                    <p className="text-xs text-slate-500 mt-1">Upload or capture crop photos to screen for disease symptoms, pests, and nutrient stress.</p>
                  </div>

                  <div className="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs text-amber-900">
                    <strong>Disclaimer:</strong> AI image analysis is an early screening tool and should not be treated as a definitive diagnosis.
                  </div>

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    {/* Left: Image Picker */}
                    <div className="lg:col-span-7 p-6 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-4">
                      <h3 className="font-bold text-slate-900 text-sm">Leaf Image Preview</h3>
                      <div className="h-64 rounded-2xl overflow-hidden bg-slate-900 border border-slate-200 relative flex items-center justify-center">
                        <img src={selectedImage} alt="Foliage preview" className="w-full h-full object-cover" />
                        {isAnalyzing && (
                          <div className="absolute inset-0 bg-emerald-900/60 flex flex-col items-center justify-center text-white">
                            <IconRefresh className="w-8 h-8 animate-spin mb-2" />
                            <span className="font-bold text-sm">Screening Leaf Features...</span>
                          </div>
                        )}
                      </div>

                      {/* Sample Selector */}
                      <div>
                        <span className="text-xs font-bold text-slate-500 uppercase tracking-wider block mb-2">Test Sample Leaves:</span>
                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                          {sampleImages.map((s) => (
                            <button
                              key={s.id}
                              onClick={() => { setSelectedImage(s.url); setSampleHint(s.hint); setAnalysisResult(null); }}
                              className={`p-2 rounded-xl border text-xs text-left ${
                                selectedImage === s.url ? 'border-emerald-500 bg-emerald-50 font-bold' : 'border-slate-200 bg-slate-50'
                              }`}
                            >
                              <img src={s.url} alt={s.label} className="w-full h-12 object-cover rounded-lg mb-1" />
                              <span className="truncate block">{s.label}</span>
                            </button>
                          ))}
                        </div>
                      </div>

                      <button
                        onClick={handleAnalyzeImage}
                        disabled={isAnalyzing}
                        className="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm rounded-xl shadow-md flex items-center justify-center gap-2"
                      >
                        <IconSparkles className="w-4 h-4" />
                        <span>Analyze Image</span>
                      </button>
                    </div>

                    {/* Right: Output */}
                    <div className="lg:col-span-5 p-6 bg-white rounded-3xl border border-slate-200 shadow-sm flex flex-col justify-between">
                      <div>
                        <h3 className="font-bold text-slate-900 text-base pb-3 border-b border-slate-100 mb-4">Diagnostic Screening Result</h3>
                        {analysisResult ? (
                          <div className="space-y-4">
                            <span className="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-100 text-rose-800 border border-rose-200">
                              {analysisResult.category}
                            </span>
                            <h4 className="text-lg font-extrabold text-slate-900">{analysisResult.status}</h4>
                            <div className="text-xs font-bold text-emerald-700">Confidence: {analysisResult.confidence}%</div>
                            <div className="p-3 bg-emerald-50 rounded-xl border border-emerald-200 text-xs text-emerald-950">
                              <strong>Recommendation:</strong> {analysisResult.recommendation}
                            </div>
                          </div>
                        ) : (
                          <div className="py-16 text-center text-slate-400 text-xs">
                            Click "Analyze Image" to run automated screening
                          </div>
                        )}
                      </div>
                      <span className="text-[11px] text-slate-400 block pt-4 border-t border-slate-100">
                        Confirm results with a local agricultural expert before treatment.
                      </span>
                    </div>
                  </div>
                </div>
              )}

              {/* === VIEW 5: FARM ZONES === */}
              {activePage === 'zones' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconZones className="w-7 h-7 text-emerald-600" />
                      Farm Zones
                    </h2>
                    <button onClick={handleSimulateSensor} className="px-3 py-1.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-xl text-xs font-bold">
                      Update Zone Values
                    </button>
                  </div>

                  {/* Grid Map */}
                  <div className="p-6 bg-slate-900 text-white rounded-3xl border border-slate-800">
                    <h3 className="font-bold text-sm text-emerald-400 uppercase tracking-wider mb-4">Spatial Zone Topography</h3>
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                      {zones.map((z) => (
                        <div key={z.id} className="p-4 bg-white/10 rounded-2xl border border-white/15 space-y-2">
                          <span className="font-bold text-base block">{z.name}</span>
                          <div className="text-xs space-y-1 text-slate-300">
                            <div>Soil Moisture: <strong className="text-white">{z.soilMoisture}%</strong></div>
                            <div>Temperature: <strong className="text-white">{z.temperature}°C</strong></div>
                            <div>Humidity: <strong className="text-white">{z.humidity}%</strong></div>
                            <div>Risk: <strong className={z.riskLevel==='High'?'text-rose-400':'text-emerald-400'}>{z.riskLevel}</strong></div>
                            <div>Updated: {z.lastUpdated}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

              {/* === VIEW 6: SENSORS (IoT) === */}
              {activePage === 'sensors' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconCpu className="w-7 h-7 text-emerald-600" />
                      Sensor Telemetry & IoT Architecture
                    </h2>
                    <button onClick={handleSimulateSensor} className="px-3.5 py-2 bg-emerald-600 text-white rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-sm">
                      <IconRefresh className="w-3.5 h-3.5" />
                      <span>Simulate Sensor Update</span>
                    </button>
                  </div>

                  {/* Flow Diagram */}
                  <div className="p-4 bg-white rounded-2xl border border-slate-200 text-xs font-semibold flex items-center justify-around text-center">
                    <span className="p-2 bg-blue-50 text-blue-800 rounded-lg">ESP32 Node</span>
                    <span>→</span>
                    <span className="p-2 bg-indigo-50 text-indigo-800 rounded-lg">Backend API / MQTT</span>
                    <span>→</span>
                    <span className="p-2 bg-emerald-50 text-emerald-800 rounded-lg">React Dashboard</span>
                  </div>

                  {/* Nodes */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div className="p-5 bg-white rounded-3xl border border-slate-200 space-y-3">
                      <div className="flex justify-between items-center">
                        <h4 className="font-bold text-slate-900">ESP32 Node 1 (Master Gateway)</h4>
                        <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Online</span>
                      </div>
                      <div className="text-xs space-y-1 text-slate-600">
                        <div>Soil Moisture: <strong className="text-emerald-700">Connected (GPIO34)</strong></div>
                        <div>Temperature: <strong className="text-emerald-700">Connected (DHT22)</strong></div>
                        <div>Humidity: <strong className="text-emerald-700">Connected (DHT22)</strong></div>
                        <div>Last data received: <strong>2 minutes ago</strong></div>
                      </div>
                    </div>

                    <div className="p-5 bg-white rounded-3xl border border-slate-200 space-y-3">
                      <div className="flex justify-between items-center">
                        <h4 className="font-bold text-slate-900">ESP32 Node 2 (Zone 2 Remote)</h4>
                        <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full text-xs font-bold">Online</span>
                      </div>
                      <div className="text-xs space-y-1 text-slate-600">
                        <div>Soil Moisture: <strong className="text-emerald-700">Connected (GPIO34)</strong></div>
                        <div>Temperature: <strong className="text-emerald-700">Connected (DHT22)</strong></div>
                        <div>Humidity: <strong className="text-emerald-700">Connected (DHT22)</strong></div>
                        <div>Last data received: <strong>1 minute ago</strong></div>
                      </div>
                    </div>
                  </div>

                  {/* Terminal Log */}
                  <div className="p-5 bg-slate-950 text-emerald-400 font-mono text-xs rounded-3xl border border-slate-800 space-y-2">
                    <span className="text-slate-400 block pb-2 border-b border-slate-800">Live JSON MQTT Payload Stream (Prototype Demo)</span>
                    {telemetryLogs.map((log, i) => (
                      <div key={i} className="text-slate-300">
                        <span className="text-slate-500">[{log.time}]</span> {log.node} → {JSON.stringify({ zone: log.zone, moisture: `${log.moisture}%`, temp: `${log.temp}°C`, hum: `${log.hum}%` })}
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* === VIEW 7: ALERTS === */}
              {activePage === 'alerts' && (
                <div className="space-y-6">
                  <div className="flex justify-between items-center">
                    <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                      <IconBell className="w-7 h-7 text-emerald-600" />
                      Farm Alerts ({alerts.length})
                    </h2>
                    <button onClick={handleSimulateAlert} className="px-3.5 py-2 bg-amber-50 text-amber-800 border border-amber-200 rounded-xl text-xs font-bold flex items-center gap-1">
                      <IconSparkles className="w-3.5 h-3.5 text-amber-600" />
                      <span>Simulate Alert</span>
                    </button>
                  </div>

                  <div className="space-y-3">
                    {alerts.map((a) => (
                      <div key={a.id} className="p-4 bg-white rounded-2xl border border-slate-200 shadow-sm text-xs space-y-2">
                        <div className="flex justify-between items-start">
                          <div className="flex items-center gap-2">
                            <span className="font-bold text-slate-900 text-sm">{a.title}</span>
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">{a.severity}</span>
                          </div>
                          <span className="text-slate-400">{a.timestamp}</span>
                        </div>
                        <p className="text-slate-600"><strong>Zone:</strong> {a.zone} • {a.explanation}</p>
                        <div className="p-2.5 bg-emerald-50 text-emerald-900 rounded-xl font-medium">
                          <strong>Suggested Action:</strong> {a.suggestedAction}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* === VIEW 8: HISTORY === */}
              {activePage === 'history' && (
                <div className="space-y-6">
                  <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                    <IconHistory className="w-7 h-7 text-emerald-600" />
                    Farm History
                  </h2>
                  <div className="p-6 bg-white rounded-3xl border border-slate-200 shadow-sm text-xs space-y-4">
                    <h3 className="font-bold text-slate-900 text-sm">Agronomic Telemetry Summary Table</h3>
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="border-b border-slate-200 text-slate-400 font-semibold uppercase">
                          <th className="py-2">Metric</th>
                          <th className="py-2">Target</th>
                          <th className="py-2">Min Recorded</th>
                          <th className="py-2">Avg Recorded</th>
                          <th className="py-2">Max Recorded</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 text-slate-700">
                        <tr><td className="py-2.5 font-bold">Soil Moisture</td><td>35-50%</td><td className="text-rose-600">21%</td><td>38%</td><td>44%</td></tr>
                        <tr><td className="py-2.5 font-bold">Temperature</td><td>22-32°C</td><td>22.4°C</td><td>30.8°C</td><td className="text-amber-600">34.2°C</td></tr>
                        <tr><td className="py-2.5 font-bold">Humidity</td><td>55-75%</td><td>52%</td><td>67%</td><td>82%</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* === VIEW 9: SETTINGS === */}
              {activePage === 'settings' && (
                <div className="space-y-6 max-w-2xl">
                  <h2 className="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                    <IconSettings className="w-7 h-7 text-emerald-600" />
                    Settings
                  </h2>
                  <div className="p-6 bg-white rounded-3xl border border-slate-200 shadow-sm space-y-4 text-xs">
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Farmer Profile Name</label>
                      <input type="text" value={farm.farmerName} onChange={(e)=>setFarm({...farm, farmerName: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                    </div>
                    <div>
                      <label className="font-bold text-slate-700 block mb-1">Farm Name</label>
                      <input type="text" value={farm.farmName} onChange={(e)=>setFarm({...farm, farmName: e.target.value})} className="w-full p-2.5 border rounded-xl" />
                    </div>
                    <div className="pt-2">
                      <button onClick={()=>alert('Settings saved!')} className="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl">Save Settings</button>
                    </div>
                  </div>
                  <div className="p-6 bg-rose-50 rounded-3xl border border-rose-200 flex justify-between items-center">
                    <div>
                      <span className="font-bold text-rose-900 text-sm block">Session Controls</span>
                      <span className="text-xs text-rose-700">Logout and return to landing page</span>
                    </div>
                    <button onClick={()=>setActivePage('landing')} className="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">
                      Logout
                    </button>
                  </div>
                </div>
              )}
            </main>
          </div>

          {/* Mobile Bottom Navigation */}
          <div className="lg:hidden fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 px-3 py-2 flex justify-around">
            {[
              { id: 'dashboard', label: 'Dashboard', icon: IconDashboard },
              { id: 'weather', label: 'Weather', icon: IconWeather },
              { id: 'ai-recommendations', label: 'AI', icon: IconBot },
              { id: 'crop-health', label: 'Health', icon: IconScan },
              { id: 'alerts', label: 'Alerts', icon: IconBell, badge: unreadAlerts }
            ].map((item) => {
              const Icon = item.icon;
              const isActive = activePage === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => setActivePage(item.id)}
                  className={`flex flex-col items-center relative py-1 px-2 ${isActive ? 'text-emerald-600 font-bold' : 'text-slate-500'}`}
                >
                  <Icon className="w-5 h-5" />
                  <span className="text-[10px] mt-0.5">{item.label}</span>
                  {item.badge > 0 && (
                    <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center">
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
